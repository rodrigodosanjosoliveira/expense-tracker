basePath: /
definitions:
  domain.Expense:
    properties:
      amount:
        type: number
      category:
        type: string
      created_at:
        type: string
      date:
        type: string
      description:
        type: string
      id:
        type: string
      updated_at:
        type: string
    type: object
  domain.ExpenseListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.Expense'
        type: array
      pagination:
        $ref: '#/definitions/domain.PaginationInfo'
    type: object
  domain.PaginationInfo:
    properties:
      has_next:
        type: boolean
      has_prev:
        type: boolean
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: rodrigodosanjosoliveira@gmail.com
    name: Rodrigo
  description: |-
    API REST para controle de despesas pessoais
    Desenvolvida com Go usando TDD e arquitetura em camadas
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Expense Tracker API
  version: "1.0"
paths:
  /expenses:
    get:
      description: Retorna despesas com suporte a filtros, ordenação e paginação
      parameters:
      - description: Filtrar por categoria
        in: query
        name: category
        type: string
      - description: Valor mínimo
        in: query
        name: min_amount
        type: number
      - description: Valor máximo
        in: query
        name: max_amount
        type: number
      - description: 'Data inicial (formato: 2025-12-29)'
        in: query
        name: start_date
        type: string
      - description: 'Data final (formato: 2025-12-29)'
        in: query
        name: end_date
        type: string
      - default: date
        description: Ordenar por (date, amount, category, created_at)
        in: query
        name: sort_by
        type: string
      - default: desc
        description: Ordem (asc, desc)
        in: query
        name: sort_order
        type: string
      - default: 50
        description: Itens por página
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset para paginação
        in: query
        name: offset
        type: integer
      - default: 1
        description: Página (alternativa ao offset)
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.ExpenseListResponse'
        "500":
          description: Erro interno
          schema:
            type: string
      summary: Listar despesas com filtros e paginação
      tags:
      - Expenses
    post:
      consumes:
      - application/json
      description: Cria uma nova despesa pessoal
      parameters:
      - description: Dados da despesa
        in: body
        name: expense
        required: true
        schema:
          $ref: '#/definitions/domain.Expense'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Expense'
        "400":
          description: Dados inválidos
          schema:
            type: string
        "500":
          description: Erro interno
          schema:
            type: string
      summary: Criar nova despesa
      tags:
      - Expenses
  /expenses/{id}:
    delete:
      description: Remove uma despesa pelo ID
      parameters:
      - description: ID da despesa
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: Despesa deletada com sucesso
        "400":
          description: ID inválido
          schema:
            type: string
        "404":
          description: Despesa não encontrada
          schema:
            type: string
        "500":
          description: Erro interno
          schema:
            type: string
      summary: Deletar despesa
      tags:
      - Expenses
    get:
      description: Retorna uma despesa específica pelo ID
      parameters:
      - description: ID da despesa
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Expense'
        "400":
          description: ID inválido
          schema:
            type: string
        "404":
          description: Despesa não encontrada
          schema:
            type: string
        "500":
          description: Erro interno
          schema:
            type: string
      summary: Buscar despesa por ID
      tags:
      - Expenses
    put:
      consumes:
      - application/json
      description: Atualiza uma despesa existente
      parameters:
      - description: ID da despesa
        in: path
        name: id
        required: true
        type: string
      - description: Dados atualizados da despesa
        in: body
        name: expense
        required: true
        schema:
          $ref: '#/definitions/domain.Expense'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Expense'
        "400":
          description: Dados inválidos
          schema:
            type: string
        "404":
          description: Despesa não encontrada
          schema:
            type: string
        "500":
          description: Erro interno
          schema:
            type: string
      summary: Atualizar despesa
      tags:
      - Expenses
schemes:
- http
swagger: "2.0"
